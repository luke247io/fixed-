# ===== Noxaria Core =====
# Owner: beim ersten Beitritt mit diesem Namen wird die UUID gespeichert.
# Danach zaehlt nur noch die UUID (Namensaenderungen sind egal).
owner-name: SolvedHawk87657
owner-uuid: ""
maintenance: false

# Gruende fuer Verwarnungen: Anzeigename|MATERIAL (max. 7)
warn-reasons:
  - "Cheaten|DIAMOND_SWORD"
  - "Beleidigung|PAPER"
  - "Rassismus|SKELETON_SKULL"
  - "Glitchen|REDSTONE"
  - "Spam|BOOK"
  - "Griefing|TNT"

# Raenge. weight = Sortierung in der Tabliste (hoeher = weiter oben).
# permissions = Rechte OHNE OP (z. B. minecraft.command.kick).
groups:
  owner:
    prefix: "&4&lOWNER &r"
    weight: 100
    permissions: [noxaria.staff, noxaria.warn, noxaria.stash]
  admin:
    prefix: "&c&lADMIN &r"
    weight: 90
    permissions: [noxaria.staff, noxaria.warn, noxaria.stash, minecraft.command.kick, minecraft.command.ban, minecraft.command.pardon, minecraft.command.tp, minecraft.command.teleport, minecraft.command.gamemode]
  streamer:
    prefix: "&5&lSTREAMER &r"
    weight: 70
    permissions: [minecraft.command.me]
  creator:
    prefix: "&d&lCREATOR &r"
    weight: 60
    permissions: [minecraft.command.me]
  premium:
    prefix: "&6&lPREMIUM &r"
    weight: 50
    permissions: []
  vip:
    prefix: "&a&lVIP &r"
    weight: 40
    permissions: []
  spieler:
    prefix: "&7"
    weight: 0
    permissions: []

